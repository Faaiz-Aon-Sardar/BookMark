[package]
name = "bookmark-launcher"
version = "2.0.0"
description = "Bookmark Launcher - Personal Web App Launcher for Windows"
authors = ["Bookmark Launcher Team"]
edition = "2021"

[lib]
name = "bookmark_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
